services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - duetfolio-data:/data
    environment:
      - BASE_CURRENCY=HKD
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  duetfolio-data:
